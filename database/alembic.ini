# Alembic configuration for Interview Bot
# Run from the project root: alembic -c database/alembic.ini <command>

[alembic]
# Path to migration scripts, relative to this .ini file
script_location = %(here)s/migrations

# Prepend sys.path entry so database/models.py is importable
prepend_sys_path = .

# Database URL — overridden by env.py reading DATABASE_URL from environment
# This value is a fallback for tooling that reads alembic.ini directly
sqlalchemy.url = postgresql+asyncpg://interview_user:password@localhost:5432/interview_db

# Timezone for revision file timestamps
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
