version: '3.9'

services:

  # ── Infrastructure ──────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: interview_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: interview_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run schema on first boot
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_user -d interview_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── ML Services ──────────────────────────────────────────────────────

  nlp-service:
    build: ./nlp_service
    restart: unless-stopped
    ports:
      - '8001:8001'
    env_file: .env
    volumes:
      - ./models:/models:ro      # mount trained BERT weights read-only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s          # BERT load takes time

  asr-service:
    build: ./asr_service
    restart: unless-stopped
    ports:
      - '8002:8002'
    env_file: .env
    volumes:
      - ./models:/models:ro      # Whisper model cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s          # Whisper download can be slow first boot

  sentiment-service:
    build: ./sentiment_service
    restart: unless-stopped
    ports:
      - '8003:8003'
    env_file: .env
    volumes:
      - ./models:/models:ro      # BiLSTM weights + GloVe embeddings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  adaptive-engine:
    build: ./adaptive_engine
    restart: unless-stopped
    ports:
      - '8004:8004'
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  report-service:
    build: ./report_service
    restart: unless-stopped
    ports:
      - '8005:8005'
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Orchestration ────────────────────────────────────────────────────

  chatbot-engine:
    build: ./chatbot_engine
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp-service:
        condition: service_healthy
      asr-service:
        condition: service_healthy
      sentiment-service:
        condition: service_healthy
      adaptive-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend ─────────────────────────────────────────────────────────

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    env_file: .env
    depends_on:
      - chatbot-engine

volumes:
  postgres_data:
